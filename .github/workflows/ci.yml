# .github/workflows/ci.yml —— CI 流程单
# 作用:每次 push 或提 PR,GitHub 免费开一台干净云电脑,从零装环境、跑全部测试、
# 统计覆盖率。全绿打勾,任何一步失败打红叉并通知。口径与本地完全一致。
# 另有每周定时档:同一套流程以 NPAP_ML_TEST_FULL=1(全参)跑一遍,兜住"没人改
# 代码时"的统计行为漂移(依赖升级/runner 镜像更新改变算法数值行为)。
# 注意:schedule 只认默认分支上的本文件——本文件合入 master 后定时才会注册生效。
name: CI

on:
  push:
    branches: [master, brunch]   # 这两个分支的每次推送都触发(按仓库实际分支名)
  pull_request:                  # 任何指向本仓库的 PR 也触发
  schedule:
    - cron: "17 20 * * 1"        # 每周一 20:17 UTC(周二 04:17 北京时间,错开整点)

jobs:
  pytest:
    runs-on: ubuntu-latest       # 在最新的 Ubuntu 云电脑上跑
    env:
      MPLBACKEND: Agg            # 无界面环境下的画图后端(conftest 也钉一层,双保险)
      # 日常 push/PR 跑瘦身档(见 tests/conftest.py 的降耗开关);
      # 每周定时档置 1 → 全参,验证统计参数与生产一致下的行为语义。
      NPAP_ML_TEST_FULL: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - name: 取出代码
        uses: actions/checkout@v4
        # push/PR 检出事件自带的 ref(PR 才能测到合并结果);定时档事件本身就
        # 注册在默认分支 master 上,不钉 ref 即检默认分支最新提交,无陈旧分支名风险

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13" # 与 pyproject.toml requires-python 钉的版本一致
          cache: pip             # 缓存依赖,第二次起安装快得多

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r WY/requirements.txt
          pip install -e .       # 顺带体检 pyproject 打包配置
          pip install -r WY/requirements-dev.txt   # 测试工具链(pytest/pytest-cov/httpx),钉版见该文件

      - name: 跑测试并统计覆盖率
        run: pytest --cov --cov-report=term-missing --cov-report=xml
        # 覆盖率 75% 门槛写入 pyproject 后,此步自动生效(阶段四)
        # 封网审计不在此档串联跑——拆到独立 audit job 与本档并行,总时长由
        # 两档相加变取 max(ML 测试折内重筛/重复 CV 变重后实测省约 6 分钟)。

      - name: 保存覆盖率报告
        if: always()             # 即使测试失败也把报告传出来供排查
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  audit:
    # 封网审计 job:拦截非回环连接,证明零外网依赖。与 pytest 并行跑,不增加
    # 总时长;全量跑同一套测试——二期接入 PK-DB/DrugComb/DailyMed/CCLE 四个
    # 新数据源,防"忘了打桩直接真连"——桩漏了在此步立刻打红,而不是消耗
    # 真实配额或污染缓存。独立成 job、审计插件不进 pytest 覆盖率档:保留
    # "审计工具不进默认流程"的设计意图。装依赖与 pytest 档重复一次,是
    # 并行换时间的代价(pip 缓存热时 <1 分钟)。
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      # 档位开关须与 pytest 档一致(注释见 pytest job),两档测的才是同一套行为
      NPAP_ML_TEST_FULL: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r WY/requirements.txt
          pip install -e .       # 顺带体检 pyproject 打包配置
          pip install -r WY/requirements-dev.txt   # 测试工具链(pytest/pytest-cov/httpx),钉版见该文件

      - name: 封网审计(拦截非回环连接,证明零外网依赖)
        run: pytest -p WY.tools.net_block

  web:
    # 前端门禁:类型检查(vue-tsc --noEmit)+ 产物打包。与 pytest 并行跑,
    # 不增加总时长;只有装依赖走 registry(与上方 pip install 同性质的安装阶段),
    # 构建本身零网络请求,不破坏"测试全断网"口径(封网审计只针对 Python 测试,
    # 见 audit job)。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WY/web
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: WY/web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 打包
        run: npm run build
